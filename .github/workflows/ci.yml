# Dev kit CI template (dc-coding-team/kit/ci/pipeline.yml). Installed as
# .github/workflows/ci.yml by `bun dc-kit install --ci`; edits here, then re-sync.
# Repo contract (package.json scripts): `test` (full suite), optional `ci:test`
# (affected tests, BASE_SHA), `ci:preview` (writes url=... to $GITHUB_OUTPUT),
# `ci:e2e` (PREVIEW_URL), `ci:deploy` (prod). Lint + typecheck come from .dev-kit.json.
# Deploys stay off until the repo sets the variable AUTO_DEPLOY=1.
# Extra build/deploy env (Quest needs ~15 keys): put them in ONE secret `BUILD_ENV`
# (dotenv, KEY=value per line). preview/deploy export it to the ci scripts; no template edit.
# A second preview URL (KiGe's DE+US): ci:preview also writes `us_url=` to $GITHUB_OUTPUT;
# ci:e2e reads PREVIEW_URL_US. Both stay empty when unused.
# Red main pings Discord via secret DISCORD_CI_WEBHOOK (notify-red; warns when unset).
name: CI

on:
  push:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: jog-4vcpu
    timeout-minutes: 5
    outputs:
      base: ${{ steps.plan.outputs.base }}
      skip: ${{ steps.plan.outputs.skip }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$BEFORE"
          else
            base="$(git merge-base origin/main HEAD || true)"
          fi
          # A PR's merge push repeats checks its PR already ran (deploys still run).
          skip=false
          case "$EVENT:$MESSAGE" in "push:Merge pull request #"*) skip=true ;; esac
          full=false
          if [ "$REF" = refs/heads/main ] || { [ "$PR_BASE_REF" = main ] && [ "$DRAFT" != true ]; }; then full=true; fi
          { echo "base=$base"; echo "skip=$skip"; echo "full=$full"; } >> "$GITHUB_OUTPUT"

  # Lint, typecheck and affected tests for every push. PR runs only add `full`.
  checks:
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.skip != 'true'
    runs-on: jog-4vcpu
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: HUSKY=0 bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/local-checks
          key: tsc-${{ hashFiles('**/bun.lock') }}-${{ github.sha }}
          restore-keys: tsc-${{ hashFiles('**/bun.lock') }}-
      - run: bun .dev-kit/dc-kit.ts ci "$BASE_SHA"
        env: { BASE_SHA: "${{ needs.plan.outputs.base }}" }
      - run: bun run --if-present ci:test
        env: { BASE_SHA: "${{ needs.plan.outputs.base }}" }

  # Full suite on main pushes and PRs into main. ponytail: one job; shard when it passes ~5 min.
  full:
    needs: plan
    if: needs.plan.outputs.full == 'true' && needs.plan.outputs.skip != 'true'
    runs-on: jog-8vcpu
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: HUSKY=0 bun install --frozen-lockfile
      - run: bun run test

  # Holds deploy secrets: ubuntu-latest until the Jog DPA is signed.
  preview:
    needs: [plan, checks]
    if: vars.AUTO_DEPLOY == '1' && github.ref == 'refs/heads/test' && github.event_name == 'push' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      us_url: ${{ steps.deploy.outputs.us_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: HUSKY=0 bun install --frozen-lockfile
      - name: Export BUILD_ENV
        env: { BUILD_ENV: "${{ secrets.BUILD_ENV }}" }
        run: '[ -z "$BUILD_ENV" ] || printf ''%s\n'' "$BUILD_ENV" >> "$GITHUB_ENV"'
      - id: deploy
        run: bun run ci:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  e2e:
    needs: preview
    if: vars.AUTO_DEPLOY == '1' && needs.preview.outputs.url != ''
    runs-on: jog-4vcpu
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: HUSKY=0 bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('**/bun.lock') }}
      - run: bun run ci:e2e
        env:
          PREVIEW_URL: ${{ needs.preview.outputs.url }}
          PREVIEW_URL_US: ${{ needs.preview.outputs.us_url }}

  # One status per SHA; deploy gates on it.
  ci-green:
    needs: [plan, checks, full, preview, e2e]
    if: always()
    runs-on: jog-4vcpu
    timeout-minutes: 2
    steps:
      - run: test "$RED" != true
        env: { RED: "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" }

  # Prod: every green main push, direct or PR merge. Holds prod secrets: ubuntu-latest.
  deploy:
    needs: ci-green
    if: always() && vars.AUTO_DEPLOY == '1' && needs.ci-green.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: { group: deploy-prod, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: HUSKY=0 bun install --frozen-lockfile
      - name: Export BUILD_ENV
        env: { BUILD_ENV: "${{ secrets.BUILD_ENV }}" }
        run: '[ -z "$BUILD_ENV" ] || printf ''%s\n'' "$BUILD_ENV" >> "$GITHUB_ENV"'
      - run: bun run ci:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: echo "Deployed $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  # Red main pings once per run. Needs the secret DISCORD_CI_WEBHOOK; without it this only warns.
  notify-red:
    needs: [ci-green, deploy]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
          MSG: "main is red at ${{ github.sha }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          [ -n "$WEBHOOK" ] || { echo "::warning::DISCORD_CI_WEBHOOK is not set; no ping sent"; exit 0; }
          curl --fail --silent --show-error -H 'Content-Type: application/json' -d "$(jq -n --arg content "$MSG" '{$content}')" "$WEBHOOK"
