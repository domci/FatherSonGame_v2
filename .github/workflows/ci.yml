name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run coverage
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/
          if-no-files-found: ignore

  # Runs only when the repo variable PAGES_ENABLED is 'true'
  # (Settings → Pages → Source: GitHub Actions, then Settings → Variables → PAGES_ENABLED = true).
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.PAGES_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          BASE_PATH: /FatherSonGame_v2/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
